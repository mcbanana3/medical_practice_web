services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: development-root-only
      MYSQL_DATABASE: medical_booking_dev
      MYSQL_USER: booking
      MYSQL_PASSWORD: development-password-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - medical_booking_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  medical_booking_mysql: